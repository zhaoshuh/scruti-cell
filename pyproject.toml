[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scruticell"
version = "0.1.0"
description = "GEO single-cell data standardization pipeline: GSE accession to analysis-ready AnnData"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Scrut-Cell Team"}
]
keywords = ["geo", "single-cell", "anndata", "bioinformatics", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "GEOparse>=2.0.4",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "neo4j>=5.20.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "pyreadr>=0.5.0",
    "loompy>=3.0.0",
    "charset-normalizer>=3.0.0",
    "biopython>=1.83",
    "bionty>=0.7.0",
    "PyMuPDF>=1.23",
    "sentence-transformers>=3.0",
    "deepagents>=0.6.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
tracing = [
    "langsmith>=0.1.0",
]

[project.scripts]
scruticell = "scruticell.cli:main"
scruticell-client = "scruticell.client.cli:client_cmd"

[project.urls]
Homepage = "https://github.com/scruti-cell/scruticell"
Repository = "https://github.com/scruti-cell/scruticell"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
